<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Your private cinema — discover, download, and watch.">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
  <title>{% block title %}Popcorn{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" data-page="{{ active_page }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="grain" aria-hidden="true"></div>

  {% block header %}
  <header class="app-header {% block header_class %}{% endblock %}" id="app-header">
    <a class="brand" href="/" aria-label="Popcorn home">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>pop<span style="color:var(--accent)">corn</span></span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="/" {{ 'aria-current=page'|safe if active_page == 'home' }}>Home</a>
      <a href="/movies" {{ 'aria-current=page'|safe if active_page == 'movies' }}>Movies</a>
      <a href="/shows" {{ 'aria-current=page'|safe if active_page == 'shows' }}>TV Shows</a>
      <a href="/downloads" {{ 'aria-current=page'|safe if active_page == 'downloads' }}>Downloads</a>
    </nav>
    <div class="header-actions">
      <a class="icon-btn" href="/search" aria-label="Search" {{ 'aria-current=page'|safe if active_page == 'search' }}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </a>
      <div class="menu-wrap">
        <button class="icon-btn" id="profile-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Your account">
          <span class="avatar" id="profile-initial" aria-hidden="true">·</span>
        </button>
        <div class="menu" id="profile-menu" role="menu" hidden>
          <div class="menu-head">
            <strong id="profile-name">Signed in</strong>
            <small id="profile-role">Popcorn member</small>
          </div>
          <a class="menu-item" href="/settings" role="menuitem">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
            Settings
          </a>
          <a class="menu-item" href="/watch" role="menuitem">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8"/></svg>
            Open Jellyfin
          </a>
          <button class="menu-item" id="install-app" type="button" role="menuitem" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 21h14"/></svg>
            Install app
          </button>
          <div class="menu-sep"></div>
          <form action="/logout" method="post">
            <button class="menu-item is-danger" type="submit" role="menuitem">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h10"/></svg>
              Sign out
            </button>
          </form>
        </div>
      </div>
    </div>
  </header>

  <nav class="tabbar" aria-label="Primary">
    <a href="/" {{ 'aria-current=page'|safe if active_page == 'home' }}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      Home
    </a>
    <a href="/movies" {{ 'aria-current=page'|safe if active_page == 'movies' }}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/></svg>
      Movies
    </a>
    <a href="/shows" {{ 'aria-current=page'|safe if active_page == 'shows' }}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="m8 3 4 3 4-3"/></svg>
      Shows
    </a>
    <a href="/search" {{ 'aria-current=page'|safe if active_page == 'search' }}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Search
    </a>
    <a href="/downloads" {{ 'aria-current=page'|safe if active_page == 'downloads' }}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 21h14"/></svg>
      Downloads
      <span class="tab-badge" id="tab-download-badge" hidden></span>
    </a>
  </nav>
  {% endblock %}

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>

  <script type="module">
    import { initShell } from "{{ url_for('static', filename='js/core/shell.js') }}";
    initShell();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
