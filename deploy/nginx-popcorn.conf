server {
    server_name popcorn.devmindset.in;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_socket_keepalive on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:5050/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location /jellyfin/ {
        auth_request /_auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_socket_keepalive on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        # Apply the Popcorn visual language to the embedded Jellyfin client.
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/popcorn-jellyfin.css"></head>';
    }

    location = /popcorn-jellyfin.css {
        auth_request /_auth;
        proxy_pass http://127.0.0.1:5050/static/jellyfin.css;
        proxy_set_header Host $host;
    }

    location @login_redirect {
        return 302 /login?next=$request_uri;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/popcorn.devmindset.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/popcorn.devmindset.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name popcorn.devmindset.in;
    return 301 https://$host$request_uri;
}
